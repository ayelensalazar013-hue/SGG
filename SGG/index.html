<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="toggleTheme" type="button">☀️ / 🌙</button>
    </div>

    <main class="container">
        <section class="card">
            <h1>Iniciar Sesión</h1>
            <p class="subtitle">Accede al Sistema de Gestión (SGG)</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    <small class="error-msg" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                        <button type="button" id="togglePassword" class="eye-btn" aria-label="Mostrar contraseña">👁️</button>
                    </div>
                    <small class="error-msg" id="passwordError"></small>
                </div>

                <div id="lockoutMessage" class="alert-box hidden"></div>

                <button type="submit" id="loginBtn" class="btn-primary">Ingresar</button>
            </form>

            <footer class="card-footer">
                <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </footer>
        </section>
    </main>

    <script src="js/loginjs/login.js"></script>
</body>
</html>
