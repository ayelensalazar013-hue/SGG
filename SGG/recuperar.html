<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Clave - SGG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button id="btn-tema" onclick="cambiarTema()">Modo Día/Noche</button>

    <div class="login">
        <h2>Cambiar Contraseña</h2>
        
        <input type="text" id="rec-usuario" placeholder="Nombre de Usuario" oninput="validarFormRecuperar()">
        
        <div class="campo-password">
            <input type="password" id="rec-pass" placeholder="Nueva Contraseña" oninput="validarFormRecuperar()">
            <button type="button" class="btn-ojo" onclick="toggleVisibilidad('rec-pass', this)">👁️</button>
        </div>

        <ul class="requisitos">
            <li id="req-min" class="invalido">❌ Mínimo 8 caracteres</li>
            <li id="req-mayus" class="invalido">❌ Al menos 1 letra Mayúscula</li>
            <li id="req-minus" class="invalido">❌ Al menos 1 letra Minúscula</li>
            <li id="req-num" class="invalido">❌ Al menos 1 número (Dígito)</li>
            <li id="req-esp" class="invalido">❌ Al menos 1 carácter especial</li>
        </ul>

        <div class="campo-password">
            <input type="password" id="rec-pass2" placeholder="Repetir Contraseña" oninput="validarFormRecuperar()">
            <button type="button" class="btn-ojo" onclick="toggleVisibilidad('rec-pass2', this)">👁️</button>
        </div>
        
        <button id="btn-submit-rec" onclick="cambiarClave()" disabled>Cambiar Contraseña</button>
        
        <p id="msg-recuperar"></p>

        <div class="enlaces">
            <a href="index.html">Volver al Login</a>
        </div>
    </div>

    <script src="js/loginjs/login.js"></script>
</body>
</html>
